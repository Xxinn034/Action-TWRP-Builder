name: Build CWM/PhilZ Recovery (Ubuntu 22.04)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Manifest 仓库 URL (CM-10.1 源码)'
        required: true
        default: 'https://github.com/CyanogenMod/android.git'
      MANIFEST_BRANCH:
        description: 'Manifest 分支 (cm-10.1)'
        required: true
        default: 'cm-10.1'
      DEVICE_TREE_URL:
        description: '你的设备树仓库 URL'
        required: true
        default: 'https://github.com/Xxinn034/android_device_ireadygo_G2'
      DEVICE_TREE_BRANCH:
        description: '设备树分支'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: '设备树路径 (如: device/ireadygo/G2)'
        required: true
        default: 'device/ireadygo/G2'
      DEVICE_NAME:
        description: '设备代号'
        required: true
        default: 'G2'
      MAKEFILE_NAME:
        description: '编译目标 (设备树修补后支持 omni_G2-eng)'
        required: true
        default: 'omni_G2-eng'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Toolchain (GCC 9 + Multilib) and Python 2
      run: |
        sudo apt update
        sudo apt install -y gcc-9 g++-9 gcc-9-multilib g++-9-multilib \
          gperf g++-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev \
          libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc \
          bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
          libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool \
          squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static \
          libstdc++-10-dev python3 tar git-lfs m4 python2 python2-dev \
          lib32stdc++6   # 安装 32 位 libstdc++ 运行时库
        
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 100
        
        sudo ln -sf /usr/lib/i386-linux-gnu/libstdc++.so.6 /usr/lib32/libstdc++.so.6
        sudo ln -sf /usr/lib/i386-linux-gnu/libgcc_s.so.1 /usr/lib32/libgcc_s.so.1
        
        sudo ln -sf /usr/bin/python2 /usr/local/bin/python2

    - name: Install Java 7 (required for CM-10.1)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '7'

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      id: pwd
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} \
          -b ${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Repo Sync
      run: repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Clone Device Tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} \
          -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
          ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Patch device tree for Omni/CM support
      run: |
        DEVICE_DIR="${{ steps.pwd.outputs.workspace-folder }}/${{ github.event.inputs.DEVICE_PATH }}"
        cd "$DEVICE_DIR"
        
        cat > omni_G2.mk << 'EOF'
        $(call inherit-product, device/ireadygo/G2/device.mk)
        $(call inherit-product, vendor/cm/config/common.mk)
        PRODUCT_NAME := omni_G2
        PRODUCT_DEVICE := G2
        PRODUCT_BRAND := ireadygo
        PRODUCT_MANUFACTURER := ireadygo
        PRODUCT_MODEL := G2
        PRODUCT_BUILD_PROP_OVERRIDES += \
            BUILD_DISPLAY_ID=CM-10.1 \
            ro.product.name=omni_G2 \
            ro.product.device=G2
        EOF
        echo "Created omni_G2.mk (CM base)"
        
        if [ ! -f vendorsetup.sh ]; then
          cat > vendorsetup.sh << 'EOF'
        add_lunch_combo omni_G2-eng
        add_lunch_combo omni_G2-userdebug
        EOF
          echo "Created vendorsetup.sh"
        else
          if ! grep -q "omni_G2" vendorsetup.sh; then
            echo "add_lunch_combo omni_G2-eng" >> vendorsetup.sh
            echo "add_lunch_combo omni_G2-userdebug" >> vendorsetup.sh
          fi
        fi
        
        cat > device.mk << 'EOF'
        LOCAL_PATH := device/ireadygo/G2
        PRODUCT_NAME := omni_G2
        PRODUCT_DEVICE := G2
        PRODUCT_BRAND := ireadygo
        PRODUCT_MANUFACTURER := ireadygo
        PRODUCT_MODEL := G2
        EOF
        echo "Created device.mk"
        
        ln -sf omni_G2.mk cm.mk 2>/dev/null || echo "cm.mk link already exists or failed"

    - name: Replace Recovery Source with PhilZ Touch
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        rm -rf bootable/recovery
        git clone https://github.com/PhilZ-cwm6/philz_touch_cwm6 bootable/recovery -b cm-10.1

    # 新增：修复 parser.hpp 缺失
    - name: Fix parser.hpp missing
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/bootable/recovery/edify
        # 如果 parser.h 存在但没有 parser.hpp，创建软链接
        if [ -f parser.h ] && [ ! -f parser.hpp ]; then
          ln -sf parser.h parser.hpp
        fi
        # 如果软链接无效，也可以直接修改 parser.cpp 中的 include（备用方案）
        # sed -i 's/#include "parser.hpp"/#include "parser.h"/' parser.cpp

    - name: Patch build system for GCC 9, Python 2, and skip Java version check
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        find build/ -type f -name "*.mk" -exec sed -i 's/-Werror=maybe-uninitialized//g' {} \;
        find build/ -type f -name "*.mk" -exec sed -i 's/-Werror=unused-parameter//g' {} \;
        find build/ -type f -name "*.mk" -exec sed -i 's/-Werror=implicit-function-declaration//g' {} \;
        sed -i '1s/python/python2/' build/tools/findleaves.py
        sed -i '/check_java_version/d' build/core/main.mk
        sed -i '/check_javac_version/d' build/core/main.mk
        echo "export CFLAGS=\"-Wno-error=implicit-function-declaration -fcommon\"" >> ~/.bashrc
        echo "export CXXFLAGS=\"-std=gnu++11 -Wno-error=unused-parameter\"" >> ~/.bashrc

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Build Recovery
      id: build
      continue-on-error: true
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        
        export CFLAGS="-Wno-error=implicit-function-declaration -fcommon"
        export CXXFLAGS="-std=gnu++11 -Wno-error=unused-parameter"
        export ALLOW_MISSING_DEPENDENCIES=true
        # 确保 32 位库路径被 ld 找到
        export LD_LIBRARY_PATH=/usr/lib32:$LD_LIBRARY_PATH
        
        source build/envsetup.sh
        lunch ${{ github.event.inputs.MAKEFILE_NAME }} || {
          echo "❌ lunch failed. Available products:"
          grep "add_lunch_combo" device/*/*/vendorsetup.sh 2>/dev/null || echo "No vendorsetup found"
          exit 1
        }
        
        make clean
        make recoveryimage V=1 -k -j$(nproc --all) 2>&1 | tee build.log
        
        if [ ${PIPESTATUS[0]} -eq 0 ]; then
          echo "build_status=success" >> $GITHUB_OUTPUT
        else
          echo "build_status=failure" >> $GITHUB_OUTPUT
        fi

    - name: Print build errors (if any)
      if: steps.build.outputs.build_status == 'failure'
      run: |
        echo "========== Build failed, printing error excerpts =========="
        cd ${{ steps.pwd.outputs.workspace-folder }}
        if [ -f build.log ]; then
          grep -i "error:" build.log | head -n 20 || echo "No error lines found."
          echo "========== Last 50 lines of build.log =========="
          tail -n 50 build.log
        else
          echo "build.log not found (likely lunch failed)"
        fi

    - name: Upload to Release
      if: steps.build.outputs.build_status == 'success'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
        name: ${{ github.event.inputs.DEVICE_NAME }}-CWM-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Recovery: PhilZ Touch / CWM
          Built on Ubuntu 22.04 with GCC 9 & Java 7
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build log (always)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: ${{ steps.pwd.outputs.workspace-folder }}/build.log
