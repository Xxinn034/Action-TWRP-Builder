name: Build CWM/PhilZ Recovery (Ubuntu 22.04)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Manifest 仓库 URL (CM-10.1 源码)'
        required: true
        default: 'https://github.com/CyanogenMod/android.git'
      MANIFEST_BRANCH:
        description: 'Manifest 分支 (cm-10.1)'
        required: true
        default: 'cm-10.1'
      DEVICE_TREE_URL:
        description: '你的设备树仓库 URL'
        required: true
        default: 'https://github.com/Xxinn034/android_device_ireadygo_G2'
      DEVICE_TREE_BRANCH:
        description: '设备树分支'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: '设备树路径 (如: device/ireadygo/G2)'
        required: true
        default: 'device/ireadygo/G2'
      DEVICE_NAME:
        description: '设备代号'
        required: true
        default: 'G2'
      MAKEFILE_NAME:
        description: '编译目标 (如: cm_G2-eng)'
        required: true
        default: 'cm_G2-eng'

jobs:
  build:
    runs-on: ubuntu-22.04   # 使用 22.04，更快调度
    permissions:
      contents: write

    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Legacy Toolchain
      run: |
        sudo apt update
        sudo apt install -y gcc-4.8 g++-4.8 gcc-4.8-multilib g++-4.8-multilib \
          gperf g++-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev \
          libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc \
          bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
          libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool \
          squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static \
          libstdc++-10-dev python3 tar git-lfs m4
        
        # 将 gcc-4.8 设为默认编译器
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-4.8 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-4.8 100
        
        # 确保 32 位库链接正确
        sudo ln -sf /usr/lib/i386-linux-gnu/libstdc++.so.6 /usr/lib32/libstdc++.so.6
        sudo ln -sf /usr/lib/i386-linux-gnu/libgcc_s.so.1 /usr/lib32/libgcc_s.so.1

    - name: Install OpenJDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      id: pwd
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} \
          -b ${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Repo Sync
      run: repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Clone Device Tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} \
          -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
          ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Replace Recovery Source with PhilZ Touch
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        rm -rf bootable/recovery
        git clone https://github.com/PhilZ-cwm6/philz_touch_cwm6 bootable/recovery -b cm-10.1

    - name: Patch build system for GCC 4.8
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        # 修复一些过时的编译标志
        find build/ -type f -name "*.mk" -exec sed -i 's/-Werror=maybe-uninitialized//g' {} \;
        find build/ -type f -name "*.mk" -exec sed -i 's/-Werror=unused-parameter//g' {} \;
        # 允许使用旧版 C++ 标准
        export CFLAGS="-Wno-error=implicit-function-declaration"
        export CXXFLAGS="-std=gnu++11"
        echo "export CFLAGS=\"-Wno-error=implicit-function-declaration\"" >> ~/.bashrc
        echo "export CXXFLAGS=\"-std=gnu++11\"" >> ~/.bashrc

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Build Recovery
      id: build
      continue-on-error: true
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        
        # 设置额外的环境变量，解决 GCC 4.8 的兼容性问题
        export CFLAGS="-Wno-error=implicit-function-declaration"
        export CXXFLAGS="-std=gnu++11"
        export ALLOW_MISSING_DEPENDENCIES=true
        
        source build/envsetup.sh
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}
        
        make clean
        make recoveryimage V=1 -k -j$(nproc --all) 2>&1 | tee build.log
        
        if [ ${PIPESTATUS[0]} -eq 0 ]; then
          echo "build_status=success" >> $GITHUB_OUTPUT
        else
          echo "build_status=failure" >> $GITHUB_OUTPUT
        fi

    - name: Print build errors (if any)
      if: steps.build.outputs.build_status == 'failure'
      run: |
        echo "========== Build failed, printing error excerpts =========="
        cd ${{ steps.pwd.outputs.workspace-folder }}
        grep -i "error:" build.log | head -n 20 || echo "No error lines found."
        echo "========== Last 50 lines of build.log =========="
        tail -n 50 build.log

    - name: Upload to Release
      if: steps.build.outputs.build_status == 'success'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
        name: ${{ github.event.inputs.DEVICE_NAME }}-CWM-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Recovery: PhilZ Touch / CWM
          Built on Ubuntu 22.04 with legacy toolchain
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build log (always)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: ${{ steps.pwd.outputs.workspace-folder }}/build.log
