name: Build TWRP
on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP manifest branch'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'Device tree GitHub URL'
        required: true
        default: 'https://github.com/Xxinn034/android_device_ployer_HiteVision'
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device path (e.g., device/manufacturer/codename)'
        required: true
        default: 'device/ployer/HiteVision'
      DEVICE_NAME:
        description: 'Device codename'
        required: true
        default: 'HiteVision'
      DEVICE_MAKEFILE:
        description: 'Device makefile name (e.g., omni_codename)'
        required: true
        default: 'omni_HiteVision'
      BUILD_TARGET:
        description: 'Build target (e.g., recoveryimage, bootimage)'
        required: true
        default: 'recoveryimage'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout build script
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt upgrade -y
        sudo apt install -y \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf \
          imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
          xsltproc zip zlib1g-dev python3

    - name: Install repo tool
      run: |
        sudo curl --create-dirs -L -o /usr/local/bin/repo -O -J https://storage.googleapis.com/git-repo-downloads/repo
        sudo chmod a+x /usr/local/bin/repo

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Initialize TWRP source
      run: |
        mkdir -p twrp
        cd twrp
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Sync source code
      run: |
        cd twrp
        repo sync -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Clone device tree
      run: |
        cd twrp
        git clone --depth=1 -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_TREE_URL }} ${{ github.event.inputs.DEVICE_PATH }}

    - name: Set up build environment
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng

    - name: Build recovery
      run: |
        cd twrp
        make -j$(nproc) ${{ github.event.inputs.BUILD_TARGET }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: twrp/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
        name: TWRP_${{ github.event.inputs.DEVICE_NAME }}_${{ github.run_number }}
        tag_name: twrp-${{ github.run_number }}
        body: |
          Automatically built TWRP recovery
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Manifest branch: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Build target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
