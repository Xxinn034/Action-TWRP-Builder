name: Build TWRP Recovery(android4.2)

on:
  workflow_dispatch:
    inputs:
      device_tree:
        description: 'Device tree repository URL (optional, leave blank to use local)'
        required: false
        default: ''
      device_tree_branch:
        description: 'Device tree branch (optional)'
        required: false
        default: 'main'

jobs:
  build:
    # 使用 Ubuntu 18.04 以获得更好的旧版兼容性
    runs-on: ubuntu-18.04

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python2 python2-dev python3 python3-dev python-is-python3

      - name: Set up Python 2 (for repo tool)
        run: |
          wget https://bootstrap.pypa.io/pip/2.7/get-pip.py
          python2 get-pip.py
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Download repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize and sync source
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni -b twrp-5.1
          repo sync -j$(nproc --all) --force-sync

      - name: Clone device tree
        run: |
          cd workspace
          if [ -z "${{ github.event.inputs.device_tree }}" ]; then
            # 如果未指定，使用本地设备树（假设已经在仓库中）
            git clone https://github.com/Xxinn034/android_device_ireadygo_G2 -b ${{ github.event.inputs.device_tree_branch }} device/ireadygo/G2
          else
            git clone ${{ github.event.inputs.device_tree }} -b ${{ github.event.inputs.device_tree_branch }} device/ireadygo/G2
          fi

      - name: Set up environment and build
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_G2-eng
          make clean
          # 先构建 host 工具，确保依赖完整
          make hosttools -j$(nproc --all)
          # 使用单线程编译 recovery，避免并行错误
          make recoveryimage -j1

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: recovery.img
          path: workspace/out/target/product/G2/recovery.img