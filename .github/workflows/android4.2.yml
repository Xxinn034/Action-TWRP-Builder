name: Build TWRP Recovery (Android 4.2)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Manifest仓库URL（通常无需修改）'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni'
      MANIFEST_BRANCH:
        description: 'Manifest分支（Android 4.x 建议使用 twrp-5.0 或 android-4.2）'
        required: true
        default: 'twrp-5.0'   # 更兼容 4.2
      DEVICE_TREE_URL:
        description: '你的设备树仓库URL'
        required: true
        default: 'https://github.com/Xxinn034/android_device_ireadygo_G2'
      DEVICE_TREE_BRANCH:
        description: '设备树分支'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: '设备树在源码中的路径（如 device/厂商/代号）'
        required: true
        default: 'device/ireadygo/G2'
      COMMON_TREE_URL:
        description: '通用树仓库URL（没有则留空）'
        required: false
      COMMON_PATH:
        description: '通用树路径（没有则留空）'
        required: false
      DEVICE_NAME:
        description: '设备代号（将用于输出文件名）'
        required: true
        default: 'G2'
      MAKEFILE_NAME:
        description: '编译目标名称（通常为 omni_设备代号）'
        required: true
        default: 'omni_G2'
      BUILD_TARGET:
        description: '编译目标（recovery 或 boot）'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
            libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses5 python3 tar \
            git-lfs m4   # 额外添加可能需要的工具

    - name: Install OpenJDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') || 
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Clone device tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Remove incompatible Android.bp
      run: |
        if [ -f ./${{ github.event.inputs.DEVICE_PATH }}/Android.bp ]; then
          echo "Removing Android.bp (soong_namespace not supported)"
          rm ./${{ github.event.inputs.DEVICE_PATH }}/Android.bp
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != null
        && github.event.inputs.COMMON_PATH != null
      run: |
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # ========== 更保守的 BoardConfig 修改 ==========
    - name: Tweak BoardConfig.mk (minimal, compatible)
      run: |
        BOARD_FILE="${{ steps.pwd.outputs.workspace-folder }}/${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk"
        if [ ! -f "$BOARD_FILE" ]; then
          echo "❌ BoardConfig.mk not found! Exiting."
          exit 1
        fi
        echo "✅ Found BoardConfig.mk"

        # 强制使用 xz 压缩（减小体积）
        sed -i '/BOARD_RAMDISK_COMPRESSOR/d' "$BOARD_FILE"
        echo "BOARD_RAMDISK_COMPRESSOR := xz" >> "$BOARD_FILE"

        # 设置语言和署名（不影响编译）
        sed -i '/TW_EXTRA_LANGUAGES/d' "$BOARD_FILE"; echo "TW_EXTRA_LANGUAGES := true" >> "$BOARD_FILE"
        sed -i '/TW_DEFAULT_LANGUAGE/d' "$BOARD_FILE"; echo "TW_DEFAULT_LANGUAGE := zh_CN" >> "$BOARD_FILE"
        sed -i '/TW_DEVICE_VERSION/d' "$BOARD_FILE"; echo "TW_DEVICE_VERSION := Xxinn034" >> "$BOARD_FILE"

        # 设置分区大小（根据设备实际调整）
        echo "BOARD_RECOVERYIMAGE_PARTITION_SIZE := 20971520" >> "$BOARD_FILE"

        # ===== 兼容性标志（解决 host 工具编译问题） =====
        # 注意：这些标志在旧版 Android 构建系统中可能有不同名称，但保留无害
        echo "TARGET_USES_PREBUILT_KERNEL := true" >> "$BOARD_FILE"
        echo "BUILD_BROKEN_USES_BUILD_COPY_HEADERS := true" >> "$BOARD_FILE"
        echo "BUILD_BROKEN_DUP_RULES := true" >> "$BOARD_FILE"

        # ===== ★ 仅禁用 SELinux（host 和 target） =====
        # 不再禁用其他组件，避免依赖缺失
        echo "TW_NO_SELINUX := true" >> "$BOARD_FILE"
        echo "SELINUX_IGNORE_NEVERALLOWS := true" >> "$BOARD_FILE"
        echo "SELINUX_SUPPORT := false" >> "$BOARD_FILE"
        echo "HOST_SELINUX_SUPPORT := false" >> "$BOARD_FILE"

        echo "🎉 BoardConfig.mk updated (minimal changes)"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # 清理 device.mk 中的引用（只清理明确禁用的组件，这里保留原逻辑，但可以简化）
    - name: Clean device.mk references (optional)
      run: |
        DEVICE_DIR="${{ steps.pwd.outputs.workspace-folder }}/${{ github.event.inputs.DEVICE_PATH }}"
        # 如果不禁用 bash/nano 等，则不需要清理，此处只做安全清理
        for mkfile in device.mk omni.mk; do
          if [ -f "$DEVICE_DIR/$mkfile" ]; then
            echo "Cleaning $mkfile (only removing SELinux related if present)"
            sed -i '/selinux/d' "$DEVICE_DIR/$mkfile"
          fi
        done

    # 语言精简（保留）
    - name: Prune non-Chinese languages
      run: |
        LANG_DIR="${{ steps.pwd.outputs.workspace-folder }}/bootable/recovery/gui/theme/extra-languages/"
        if [ -d "$LANG_DIR" ]; then
          echo "Deleting non-Chinese language folders (keeping fonts/ and languages/)..."
          cd "$LANG_DIR"
          for lang in $(ls -d */ 2>/dev/null | grep -v -E '^(fonts|languages|zh_CN)/'); do
            echo "Removing $lang"
            rm -rf "$lang"
          done
          cd - >/dev/null
          echo "✅ Language folders pruned"
        else
          echo "⚠️ extra-languages directory not found"
        fi

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Switch to Python 2
      run: |
        sudo apt-get install -y python2
        wget https://bootstrap.pypa.io/pip/2.7/get-pip.py
        python2 get-pip.py
        sudo rm -rf /usr/bin/python
        sudo ln -s /usr/bin/python2 /usr/bin/python
      continue-on-error: false

    # ========== 构建 recovery（增强日志和错误处理） ==========
    - name: Building recovery
      id: build
      continue-on-error: true   # 允许后续步骤打印错误日志
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        
        # ★★★ 环境变量：彻底禁用 host SELinux 编译 ★★★
        export BUILD_HOST_SEPOLICY=false
        export HOST_SELINUX_SUPPORT=false
        export SELINUX_SUPPORT=false
        export ALLOW_MISSING_DEPENDENCIES=true
        export HOST_GLOBAL_CFLAGS="-fcommon"
        export LC_ALL=C   # 避免 locale 警告
        
        # ★★★ 修补 libselinux 和 checkpolicy（防止链接错误）★★★
        if grep -q "LOCAL_WHOLE_STATIC_LIBRARIES.*libpcre" external/libselinux/Android.mk; then
          echo "Patching external/libselinux/Android.mk to remove libpcre dependency"
          sed -i '/LOCAL_WHOLE_STATIC_LIBRARIES/s/libpcre//g' external/libselinux/Android.mk
        fi
        sed -i 's/^te_assert_t \*te_assertions;/extern te_assert_t *te_assertions;/' external/checkpolicy/checkpolicy.h
        if ! grep -q "te_assert_t \*te_assertions" external/checkpolicy/checkpolicy.c; then
          echo "te_assert_t *te_assertions = NULL;" >> external/checkpolicy/checkpolicy.c
        fi
        sed -i '/^int te_assertions = 0;/d' external/checkpolicy/checkpolicy.c
        
        # 设置构建环境
        source build/envsetup.sh
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        make clean
        
        # 开始构建，使用 V=1 输出详细命令，-k 继续尝试
        make ${{ github.event.inputs.BUILD_TARGET }}image V=1 -k -j$(nproc --all) 2>&1 | tee build.log
        # 保存构建结果状态
        if [ ${PIPESTATUS[0]} -eq 0 ]; then
          echo "build_status=success" >> $GITHUB_OUTPUT
        else
          echo "build_status=failure" >> $GITHUB_OUTPUT
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # ========== 如果构建失败，打印错误日志摘要 ==========
    - name: Print build errors (if any)
      if: steps.build.outputs.build_status == 'failure'
      run: |
        echo "========== Build failed, printing error excerpts =========="
        cd ${{ steps.pwd.outputs.workspace-folder }}
        # 从 build.log 中提取 error 行
        grep -i "error:" build.log | head -n 20 || echo "No error lines found in build.log"
        echo "========== Last 50 lines of build.log =========="
        tail -n 50 build.log

    - name: Upload to Release
      if: steps.build.outputs.build_status == 'success'
      uses: softprops/action-gh-release@v2
      with:
        files: | 
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*vendor*.img
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}.img
          Built for Android 4.2 with compatibility fixes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload build log (always)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: ${{ steps.pwd.outputs.workspace-folder }}/build.log
